<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniSearch</title>
    <link rel="stylesheet" href="search.css" />
  </head>
  <body>
    <header>
      <div class="search-box">
        <input
          id="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search your mail…"
          autofocus
        />
        <button id="clear" class="clear" type="button" title="Clear search" hidden>&times;</button>
      </div>
      <div class="actions">
        <button id="filter-toggle" class="icon-btn" type="button" title="Show filter panel">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M1 2h14l-5 7v5l-4-2V9z"/>
          </svg>
        </button>
        <span class="sort-label" aria-hidden="true">Sort</span>
        <select id="sort" title="Sort results">
          <option value="relevance">Relevance</option>
          <option value="date-desc">Date (newest first)</option>
          <option value="date-asc">Date (oldest first)</option>
          <option value="subject">Subject (A–Z)</option>
          <option value="from">From (A–Z)</option>
          <option value="to">To (A–Z)</option>
          <option value="folder">Folder (A–Z)</option>
        </select>
        <button id="settings" class="icon-btn" type="button" title="OmniSearch settings">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M15 7h-1.1c-.1-.5-.3-1-.5-1.4l.8-.8c.4-.4.4-1 0-1.4l-.7-.7c-.4-.4-1-.4-1.4 0l-.8.8c-.4-.2-.9-.4-1.4-.5V1c0-.6-.4-1-1-1H7c-.6 0-1 .4-1 1v1.1c-.5.1-1 .3-1.4.5l-.8-.8c-.4-.4-1-.4-1.4 0l-.7.7c-.4.4-.4 1 0 1.4l.8.8c-.2.4-.4.9-.5 1.4H1c-.6 0-1 .4-1 1v1c0 .6.4 1 1 1h1.1c.1.5.3 1 .5 1.4l-.8.8c-.4.4-.4 1 0 1.4l.7.7c.4.4 1 .4 1.4 0l.8-.8c.4.2.9.4 1.4.5V15c0 .6.4 1 1 1h1c.6 0 1-.4 1-1v-1.1c.5-.1 1-.3 1.4-.5l.8.8c.4.4 1 .4 1.4 0l.7-.7c.4-.4.4-1 0-1.4l-.8-.8c.2-.4.4-.9.5-1.4H15c.6 0 1-.4 1-1V8c0-.6-.4-1-1-1zM8 11c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="loading" class="loading" hidden>
      <span class="spinner"></span><span>Loading your mail index…</span>
    </div>

    <div id="status" class="status"></div>
    <progress id="progress" max="1" value="0" hidden></progress>

    <div id="content-layout">
      <!-- Filter panel — toggled visible by the funnel button; side set in Options -->
      <aside id="filter-panel" hidden>
        <div class="fp-head">
          <span class="fp-title">Filters</span>
          <button id="fp-reset" class="linkbtn" type="button">Reset</button>
        </div>

        <div class="fp-section">
          <span class="fp-label">Date range</span>
          <div class="fp-date-row">
            <input type="date" id="fp-date-from" title="From date" />
            <span class="fp-date-sep" aria-hidden="true">–</span>
            <input type="date" id="fp-date-to" title="To date" />
          </div>
        </div>

        <div class="fp-section">
          <label class="fp-label" for="fp-subject">Subject</label>
          <input type="text" id="fp-subject" class="fp-text" placeholder="keywords…" autocomplete="off" />
        </div>

        <div class="fp-section">
          <label class="fp-label" for="fp-from">From</label>
          <input type="text" id="fp-from" class="fp-text" placeholder="keywords…" autocomplete="off" />
        </div>

        <div class="fp-section">
          <label class="fp-label" for="fp-to">To</label>
          <input type="text" id="fp-to" class="fp-text" placeholder="keywords…" autocomplete="off" />
        </div>

        <div class="fp-section">
          <span class="fp-label">Accounts</span>
          <div id="fp-accounts" class="fp-multiselect"></div>
        </div>

        <div class="fp-section">
          <span class="fp-label">Folders</span>
          <div id="fp-folders" class="fp-multiselect"></div>
        </div>
      </aside>

      <div id="results-col">
        <ul id="results"></ul>
        <div id="empty" class="empty"></div>
      </div>
    </div>

    <script src="search.js"></script>
  </body>
</html>
